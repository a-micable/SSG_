# Local isolated CLI sandbox only. Not production IaC.
# No databases, message brokers, or cloud services.
# Usage: docker compose up --build
services:
  ssg:
    build: .
    environment:
      SSG_LOG_LEVEL: INFO
      SSG_LOG_FORMAT: json
    command:
      - sh
      - -c
      - |
        set -e
        ssg health
        ssg init /tmp/sandbox-site --name Sandbox --url http://localhost:8000
        ssg build --config /tmp/sandbox-site/config.yml
        test -f /tmp/sandbox-site/dist/index.html
        test -f /tmp/sandbox-site/dist/feed.xml
        test -f /tmp/sandbox-site/dist/sitemap.xml
        echo "SANDBOX_OK write/verify/replay complete"
