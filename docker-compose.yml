version: '3.8'
services:
  backend:
    build: ./platform/backend
    ports:
      - '8000:8000'
    volumes:
      - ./:/srv/project:ro
      - ./platform/backend/app:/app/app:ro
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - redis
      - db

  # Frontend is optional during local dev; run with `npm run dev` in frontend/
  redis:
    image: redis:7
    ports:
      - '6379:6379'

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: platform
    ports:
      - '5432:5432'
