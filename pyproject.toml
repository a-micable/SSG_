[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssg-cli"
version = "1.0.0"
description = "Python CLI static site generator (Markdown, Jinja2, RSS, sitemap)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SSG Contributors" }]
keywords = ["cli", "ssg", "static-site", "markdown", "devtools"]
dependencies = [
    "click>=8.1.0",
    "Jinja2>=3.1.0",
    "python-frontmatter>=1.0.0",
    "markdown>=3.5.0",
    "PyYAML>=6.0.0",
    "watchdog>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pip-tools>=7.4.0",
    "pip-audit>=2.7.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
ssg = "ssg.cli:cli"

[tool.setuptools.packages.find]
include = ["ssg*"]
exclude = ["tests*", "platform*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
pretty = true

[tool.coverage.run]
source = ["ssg"]
branch = true
omit = ["ssg/__main__.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
